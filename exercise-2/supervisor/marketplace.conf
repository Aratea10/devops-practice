[program:marketplace]
command=/home/ubuntu/.nvm/versions/node/v22.22.2/bin/node /home/ubuntu/react-app/node_modules/next/dist/bin/next start
directory=/home/ubuntu/react-app
user=ubuntu
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/marketplace.err.log
stdout_logfile=/var/log/marketplace.out.log
environment=
    PORT="4000",
    DATABASE_URL="postgresql://postgres:postgres@localhost:5432/marketplace?schema=public",
    JWT_SECRET="CHANGE_ME"
